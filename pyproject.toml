[project]
name = "caten-music"
version = "0.7.0"
description = "A music web application for Caten Church."
authors = [{ name = "Salt Chang", email = "saltchang@outlook.com" }]
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "alembic>=1.15.1,<2.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "certifi>=2025.8.3,<2026.0.0",
    "chardet>=5.2.0",
    "click>=8.1.7",
    "dropbox>=12.0.2",
    "fastapi>=0.118.0,<0.119.0",
    "flask>=2.2.5",
    "flask-apscheduler>=1.13.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-sqlalchemy>=3.0.0",
    "greenlet>=3.1.1,<4.0.0",
    "gunicorn>=23.0.0",
    "idna>=3.10",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "markupsafe>=3.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "psycopg2>=2.9.10",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "pytest>=8.3.3",
    "python-decouple>=3.8,<4.0",
    "python-decouple-typed>=3.11.0,<4.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "six>=1.16.0",
    "sqlalchemy>=2.0.43,<3.0.0",
    "urllib3>=2.2.3",
    "uvicorn>=0.37.0,<0.38.0",
    "werkzeug>=3.1.3",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9.5",
    "colorlog>=6.9.0",
]

[tool.uv]
package = false

[tool.pyright]
include = ["caten_music", "migrations"]
exclude = ["**/node_modules", "**/__pycache__"]
ignore = ["**/site-packages/*", "**/dist-packages/*", "**/python3.1*/*"]
stubPath = "type-stub"
reportMissingImports = "error"
reportMissingTypeStubs = false
typeCheckingMode = "standard"
pythonVersion = "3.14"
