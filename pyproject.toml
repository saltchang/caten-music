[project]
name = "caten-music"
version = "0.7.0"
description = "A music web application for Caten Church."
authors = [{ name = "Salt Chang", email = "saltchang@outlook.com" }]
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "alembic>=1.15.1,<2.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "dropbox>=12.0.2",
    "fastapi>=0.118.0,<0.119.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "pyjwt[crypto]>=2.10.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.43,<3.0.0",
    "uvicorn>=0.37.0,<0.38.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.5",
    "colorlog>=6.9.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.26.0",
    "aiosqlite>=0.21.0",
    "pyright>=1.1.408",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
